<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PREVICULTUR — Tableau de bord</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a class="nav-brand" href="index.html">PREVICULTUR</a>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="dashboard.html" class="active">Tableau de bord</a>
            <a href="glossaire.html">Glossaire</a>
            <a href="datasources.html">Sources</a>
        </div>
    </nav>

    <div class="app-body">

        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Rentabilité Agricole</h1>
                <p>Analyse par Région &amp; Département</p>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Culture</label>
                    <select id="select-culture"></select>
                </div>
                <div class="control-group">
                    <label>Saison</label>
                    <select id="select-saison"></select>
                </div>
                <div class="control-group">
                    <label>Année</label>
                    <select id="select-annee"></select>
                </div>
            </div>

            <div id="breadcrumb" class="hidden">
                <button id="btn-back">⬅ Vue Nationale</button>
                <div id="region-title">France Entière</div>
            </div>

            <div class="top-yields-container">
                <div class="top-yields-header">
                    <label>Top Rendements</label>
                    <button id="btn-table-filter" class="btn-small">Culture ciblée</button>
                </div>
                <div class="table-wrapper">
                    <table id="yield-table">
                        <thead>
                            <tr>
                                <th>Département</th>
                                <th>Culture</th>
                                <th>Rend.</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </aside>

        <main class="map-wrapper">
            <div id="map-container"></div>

            <!-- Légende flottante — haut droite -->
            <div class="legend-container">
                <div class="legend-block">
                    <div class="legend-prod-header">
                        <label>Production</label>
                        <select id="select-unit">
                            <option value="tonnes">Tonnes (T / kT)</option>
                            <option value="eiffel">Tours Eiffel</option>
                            <option value="pyramid">Pyramides Khéops</option>
                        </select>
                    </div>
                    <div id="legend-color-gradient" class="legend-bar"></div>
                    <div class="legend-labels">
                        <span id="legend-prod-min">0</span>
                        <span id="legend-prod-max">0</span>
                    </div>
                </div>

                <div class="bar-chart-container">
                    <label id="bar-chart-title">Comparaison : France</label>
                    <div id="bar-chart"></div>
                </div>

                <div class="legend-block">
                    <label>Rentabilité (€/ha)</label>
                    <div id="legend-size-container"></div>
                </div>
            </div>

            <div id="chart-panel">
                <div class="chart-header">
                    <h3 id="chart-title">Historique : France</h3>
                    <div class="chart-toggles">
                        <label><input type="radio" name="metric" value="production" checked> Production</label>
                        <label><input type="radio" name="metric" value="rentabilite"> Rentabilité</label>
                        <label><input type="radio" name="metric" value="stock"> Stock mensuel</label>
                    </div>
                </div>
                <div id="line-chart"></div>
            </div>
        </main>
    </div>

    <div id="tooltip" class="tooltip hidden"></div>

    <script src="script.js"></script>
</body>
</html>
